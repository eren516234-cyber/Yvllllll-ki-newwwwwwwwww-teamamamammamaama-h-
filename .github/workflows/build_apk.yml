name: Build YVL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" || true

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart version
        run: flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Release APK (split per ABI)
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  release-apks/YVL-arm64.apk  || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/YVL-arm32.apk  || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk     release-apks/YVL-x86_64.apk || true
          ls -lh release-apks/

      - name: Upload APK artifacts (30-day cache)
        uses: actions/upload-artifact@v4
        with:
          name: YVL-Release-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "YVL Build #${{ github.run_number }}"
          body: |
            ## YVL Music App — Build #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ---

            ### 📱 Download APK

            | File | Architecture | Use for |
            |------|-------------|---------|
            | **YVL-arm64.apk** | ARM 64-bit | ✅ Most modern phones (recommended) |
            | **YVL-arm32.apk** | ARM 32-bit | Older phones |
            | **YVL-x86_64.apk** | x86_64 | Emulators |

            > **Tip:** Download `YVL-arm64.apk` for almost all modern Android phones.

            ---
            *Built automatically by GitHub Actions*
          files: |
            release-apks/YVL-arm64.apk
            release-apks/YVL-arm32.apk
            release-apks/YVL-x86_64.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
