name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build release APK (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: flutter build apk --release --split-per-abi

      - name: Build release APK (unsigned fallback)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --split-per-abi

      - name: Upload release APKs
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: yvl-release-apk
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload unsigned release APKs
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: yvl-unsigned-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "YVL Build #${{ github.run_number }}"
          body: |
            ## YVL Auto Build

            Automated build from commit ${{ github.sha }}

            ### What's new
            - 🎨 New Almond Dark theme (ultra dark with warm almond tones)
            - 🎤 Lyrics now load correctly (30s tolerance, unknown-duration fix)
            - 🎵 Lyrics mode bar always visible in full-screen view
            - 🚫 Hindi songs removed from Home & Explore
            - 🔍 Null videoId guard added (fixes silent playback failures)

            ### Download
            Pick the APK matching your device:
            - `arm64-v8a` -> Modern phones (recommended)
            - `armeabi-v7a` -> Older 32-bit phones
            - `x86_64` -> Emulators / x86 devices
          files: build/app/outputs/flutter-apk/app-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
